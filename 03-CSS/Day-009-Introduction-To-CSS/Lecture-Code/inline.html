<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS</title>
</head>
<body>
     <!-- Inline CSS applied directly inside the "style" attribute -->
    <h1 style="background-color: aqua;">Welcome to Inline CSS</h1> 

    <h2 style="background-color: bisque;">Background color changes to bisque</h2>

</body>
</html>
